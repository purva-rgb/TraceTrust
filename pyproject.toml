[project]
name = "tracetrust"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2",
  "pydantic-settings>=2",
  "PyJWT>=2.8",
  "eth-account>=0.13",
  "hexbytes>=1.2",
  "web3>=6",
  "python-dotenv>=1.0",
]

[project.scripts]
app = "backend.main:app"

[tool.vercel]
entrypoint = "backend.main:app"
